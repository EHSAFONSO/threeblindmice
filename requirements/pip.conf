# Política do pip para este projeto (o equivalente ao .npmrc com ignore-scripts).
# O CI e o Docker apontam PIP_CONFIG_FILE para cá; para usar no seu venv:
#   copy requirements\pip.conf .venv\pip.ini      (Windows)
#   cp requirements/pip.conf .venv/pip.conf       (Linux/macOS)
[global]
# Só wheels: instalar um pacote nunca executa o setup.py dele.
only-binary = :all:
# Única exceção: sem wheel no PyPI (dependência do pywebview). Código revisado
# e travado pelo hash do sdist em requirements/desktop.txt.
no-binary = proxy-tools
# Ignora versões publicadas há menos de 3 dias: a maioria dos pacotes
# sequestrados é descoberta e removida do PyPI nesse intervalo.
uploaded-prior-to = P3D
