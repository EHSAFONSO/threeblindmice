[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "threeblindmice"
version = "0.5.0"
description = "Toolkit defensivo de avaliação de segurança: Scout (recon), Sniffer (análise) e Squeak (relatórios)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "threeblindmice[web]",
]

[project.scripts]
tbm = "tbm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tbm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: precisa do ambiente Docker Compose (TBM_INTEGRATION=1)"]
filterwarnings = ["ignore:.*httpx2.*"]  # aviso interno do starlette.testclient

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# ASYNC109: timeouts explícitos por função são intencionais em código de rede.
# UP042: `str, Enum` serializa de forma limpa no pydantic/JSON.
ignore = ["ASYNC109", "UP042"]

[tool.ruff.lint.per-file-ignores]
"src/tbm/cli.py" = ["E501"]  # declarações de opções do Typer ficam mais legíveis numa linha
