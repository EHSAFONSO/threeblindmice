[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "threeblindmice"
version = "0.8.0"
description = "Toolkit defensivo de avaliação de segurança: Scout (recon), Sniffer (análise) e Squeak (relatórios)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
desktop = ["threeblindmice[web]", "pywebview>=5", "pystray>=0.19", "Pillow>=10"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "Pillow>=10",
    "playwright>=1.45",  # testes da interface no navegador (usa o Chrome/Edge já instalado)
    "pip-audit>=2.7",  # vulnerabilidades conhecidas nos locks
    "cyclonedx-bom>=4",  # SBOM das releases
    "uv>=0.5",  # gera os locks (requirements/lock.py)
    "threeblindmice[web]",
]

[project.scripts]
tbm = "tbm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tbm"]

# Cadeia de suprimentos. As faixas (>=) acima valem para quem instala o tbm do
# PyPI; o CI, o Docker e o instalador do Windows usam os locks em requirements/,
# com versões exatas e hashes. Para regenerar: python requirements/lock.py
[tool.uv.pip]
universal = true  # um lock só para Windows, Linux e macOS
python-version = "3.11"  # a menor versão suportada
generate-hashes = true
exclude-newer = "3 days"  # ignora versões publicadas há menos de 3 dias
only-binary = [":all:"]  # só wheels: nenhum setup.py roda na instalação
no-binary = ["proxy-tools"]  # única exceção: sem wheel no PyPI (código revisado, travado pelo hash)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: precisa do ambiente Docker Compose (TBM_INTEGRATION=1)",
    "e2e: interface no navegador (Playwright + Edge/Chrome instalados)",
]
filterwarnings = ["ignore:.*httpx2.*"]  # aviso interno do starlette.testclient

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# paramiko sem stubs; pywebview/pystray são opcionais (extra "desktop") e não ficam no CI
module = ["paramiko", "paramiko.*", "webview", "webview.*", "pystray", "pystray.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# ASYNC109: timeouts explícitos por função são intencionais em código de rede.
# UP042: `str, Enum` serializa de forma limpa no pydantic/JSON.
ignore = ["ASYNC109", "UP042"]

[tool.ruff.lint.per-file-ignores]
"src/tbm/cli.py" = ["E501"]  # declarações de opções do Typer ficam mais legíveis numa linha
"src/tbm/squeak/guides.py" = ["E501"]  # tabela de menus por marca: uma linha por caminho
"src/tbm/locale_en.py" = ["E501"]  # catálogo de traduções: uma frase por linha
