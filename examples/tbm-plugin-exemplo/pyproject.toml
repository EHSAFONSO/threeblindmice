[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tbm-plugin-exemplo"
version = "0.1.0"
description = "Plugin de exemplo do threeblindmice: um check, um destino de alerta e um enriquecedor."
requires-python = ">=3.11"
dependencies = ["threeblindmice>=0.10"]

# Cada grupo é um ponto de extensão do tbm. O valor aponta para a classe.
[project.entry-points."tbm.checks"]
telnet-2323 = "tbm_plugin_exemplo:TelnetEscondido"

[project.entry-points."tbm.notifiers"]
arquivo = "tbm_plugin_exemplo:AlertaEmArquivo"

[project.entry-points."tbm.discovery"]
impressora = "tbm_plugin_exemplo:MarcaImpressoras"

[tool.hatch.build.targets.wheel]
packages = ["src/tbm_plugin_exemplo"]
