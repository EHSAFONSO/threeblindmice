# Release: ao criar uma tag v* (ex.: git tag v0.3.0 && git push --tags)
#   1. roda o CI inteiro
#   2. confere que a tag bate com a versão do pyproject.toml
#   3. publica no PyPI (trusted publishing, sem token guardado no repositório)
#   4. publica a imagem Docker no GHCR
#   5. gera o instalador do Windows (PyInstaller + Inno Setup)
#   6. cria o GitHub Release com os artefatos
#
# Configuração única no PyPI (antes do primeiro release):
#   pypi.org → Your projects → Publishing → Add a new pending publisher
#   owner: EHSAFONSO · repo: threeblindmice · workflow: release.yml · environment: pypi
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          lock: dev
          editable: "false"
      - name: Confere tag x versão
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ versão v$version"; exit 1; }
      # sem isolamento: usa o hatchling travado em requirements/dev.txt
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  windows-installer:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          lock: desktop
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version 6.7.3 -y --no-progress }
      - run: python packaging/windows/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-installer
          path: dist/*-setup.exe*

  pypi:
    # espera o instalador: assim PyPI e GitHub Release saem juntos ou nenhum sai
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [pypi, docker, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: windows-installer
          path: dist/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Windows:** baixe o `threeblindmice_*_x64-setup.exe` abaixo e execute. Não precisa de Python.
            O instalador ainda não tem assinatura digital: o Windows pode mostrar "O Windows protegeu o computador";
            clique em *Mais informações* → *Executar assim mesmo*. Para conferir que o arquivo é o original,
            compare o SHA-256 (`certutil -hashfile <arquivo> SHA256`) com o do `.sha256` desta página.

            **Python:** `pip install "threeblindmice[desktop]"`
