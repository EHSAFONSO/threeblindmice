# Release: ao criar uma tag v* (ex.: git tag v0.3.0 && git push --tags)
#   1. roda o CI inteiro
#   2. confere que a tag bate com a versão do pyproject.toml
#   3. publica no PyPI (trusted publishing, sem token guardado no repositório)
#   4. publica a imagem Docker no GHCR
#   5. gera o instalador do Windows (PyInstaller + Inno Setup)
#   6. cria o GitHub Release com os artefatos
#
# Configuração única no PyPI (antes do primeiro release):
#   pypi.org → Your projects → Publishing → Add a new pending publisher
#   owner: EHSAFONSO · repo: threeblindmice · workflow: release.yml · environment: pypi
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Confere tag x versão
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ versão v$version"; exit 1; }
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows-installer:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pip install ".[desktop]" "pyinstaller>=6.22,<7"
      - run: python packaging/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe*

  pypi:
    # espera o instalador: assim PyPI e GitHub Release saem juntos ou nenhum sai
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [pypi, docker, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Windows:** baixe o `threeblindmice_*_x64-setup.exe` abaixo e execute. Não precisa de Python.
            O instalador ainda não tem assinatura digital: o Windows pode mostrar "O Windows protegeu o computador";
            clique em *Mais informações* → *Executar assim mesmo*. Para conferir que o arquivo é o original,
            compare o SHA-256 (`certutil -hashfile <arquivo> SHA256`) com o do `.sha256` desta página.

            **Python:** `pip install "threeblindmice[desktop]"`
