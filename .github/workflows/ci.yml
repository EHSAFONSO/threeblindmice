name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reutilizado pelo release.yml antes de publicar

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          lock: dev
      - run: ruff check src tests
      # Checa os tipos como se estivesse em cada SO: código específico de
      # plataforma (ex.: asyncio.ProactorEventLoop, só no Windows) passava
      # localmente e quebrava aqui.
      - run: |
          mypy --platform linux src
          mypy --platform win32 src
          mypy --platform darwin src

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: ${{ matrix.python }}
          lock: dev
      - run: pytest -q -m "not e2e"
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12') }}
      # Cobertura medida num job só (os outros não pagam o custo); falha abaixo do fail_under do pyproject.
      - name: pytest com cobertura
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          coverage run -m pytest -q -m "not e2e"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report

  e2e:
    # A interface num navegador de verdade (Chrome no Linux, Edge no Windows), já instalado no runner:
    # o Playwright não baixa navegador nenhum.
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          lock: dev
      - run: pytest -q -m e2e tests/e2e
        env:
          TBM_E2E_REQUIRED: "1"

  audit:
    # Vulnerabilidades conhecidas (OSV/PyPI) em tudo o que os locks instalam.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          lock: dev
      - run: |
          for lock in runtime dev desktop; do
            pip-audit -r "requirements/$lock.txt" --no-deps --disable-pip --progress-spinner off
          done

  integration:
    # Sobe serviços vulneráveis de propósito e roda o tbm contra eles, dentro da rede do Compose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # Serviços em segundo plano e só o scanner em primeiro plano: se um serviço
      # cair, apenas o teste dele falha (com --abort-on-container-exit, um crash
      # derrubava o scanner antes de qualquer assert).
      - name: Sobe o laboratório
        run: docker compose -f integration/compose.yml up -d --build --wait --wait-timeout 120 redis ftp web ssh snmp
      - name: Testes de integração
        run: docker compose -f integration/compose.yml run --rm --build scanner
      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: |
          docker compose -f integration/compose.yml ps -a
          docker compose -f integration/compose.yml logs --no-color
      - if: always()
        run: docker compose -f integration/compose.yml down -v

  secrets:
    # O tbm escaneia o próprio repositório; os achados aparecem na aba Security e nos PRs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          lock: runtime
          editable: "false"
      - run: tbm secrets . --output tbm-secrets.sarif --no-fail
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          sarif_file: tbm-secrets.sarif
          category: tbm-secrets
