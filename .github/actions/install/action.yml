# Instala Python + dependências travadas (requirements/*.txt) com a política de
# requirements/pip.conf: versões exatas com hash, só wheels, 3+ dias de idade.
# Única porta de entrada de pacotes no CI: os testes de tests/test_supply_chain.py
# recusam `pip install` solto nos workflows.
name: Instalar dependências travadas
inputs:
  python-version:
    required: true
  lock:
    description: "dev, runtime ou desktop"
    required: true
  editable:
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements/*.txt
    - name: pip e setuptools travados
      shell: bash
      # Antes da política: o pip que vem no Python pode ser antigo demais para --uploaded-prior-to.
      run: |
        python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements/bootstrap.txt
    - name: Dependências travadas
      shell: bash
      run: |
        echo "PIP_CONFIG_FILE=$GITHUB_WORKSPACE/requirements/pip.conf" >> "$GITHUB_ENV"
        export PIP_CONFIG_FILE="$GITHUB_WORKSPACE/requirements/pip.conf"
        python -m pip install --require-hashes --no-build-isolation -r "requirements/${{ inputs.lock }}.txt"
        python -m pip install --no-deps --no-build-isolation ${{ inputs.editable == 'true' && '-e' || '' }} .
        python -m pip check
