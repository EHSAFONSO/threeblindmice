# Arquivo de escopo do threeblindmice.
#
# Sem um arquivo de escopo, o tbm só aceita alvos em redes privadas
# (10/8, 172.16/12, 192.168/16, loopback, link-local, CGNAT).
# Para escanear qualquer outra coisa (ex.: seu VPS), copie este arquivo
# para scope.yaml, liste os alvos e declare que você tem autorização.
#
# Escaneie apenas sistemas que são seus ou que você tem permissão
# por escrito para testar.

authorized: true          # obrigatório: você confirma que tem autorização
owner: "Seu nome"          # quem responde por este escopo

allow:
  - 192.168.0.0/24         # sua rede doméstica
  - 127.0.0.1
  # - 203.0.113.10         # seu VPS (IP público)
  # - meuservidor.exemplo.com

exclude:
  - 192.168.0.1            # ex.: o roteador do provedor, que você não quer tocar
